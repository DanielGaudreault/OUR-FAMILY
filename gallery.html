<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" type="image/png" href="images/MyLogo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/MyLogo.png">
</head>
<body>
    <!-- ===== LOGO - TOP LEFT ===== -->
    <div class="home-link" onclick="goToHomePage()">
        <img src="images/MyLogo.png" alt="Home">
    </div>

    <!-- ===== SIDE TAB ===== -->
    <div class="side-tab" id="sideTab">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
        <a href="family.html" class="nav-link"><i class="fas fa-users"></i> Family</a>
        <a href="timeline.html" class="nav-link"><i class="fas fa-clock"></i> Timeline</a>
        <a href="gallery.html" class="nav-link active"><i class="fas fa-image"></i> Gallery</a>
        <a href="achievements.html" class="nav-link"><i class="fas fa-trophy"></i> Achievements</a>
        <a href="contact.html" class="nav-link"><i class="fas fa-envelope"></i> Contact</a>
    </div>

    <!-- ===== MENU BUTTON - TOP RIGHT ===== -->
    <button class="side-tab-toggle" onclick="toggleSideTab()">
        <span class="side-tab-span">Menu</span>
    </button>

    <!-- ===== PAGE CONTENT - CENTERED ===== -->
    <section class="page-hero">
        <div class="page-content" style="max-width: 1000px; margin: 0 auto;">
            <h1>🖼️ Family Gallery</h1>
            <p class="page-subtitle">Moments we treasure.</p>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                <div class="highlight-card" style="height: 180px; display: flex; flex-direction: column; justify-content: center;">
                    <i class="fas fa-image" style="font-size: 40px;"></i>
                    <p style="color: #f0f0f0; margin-top: 10px;">Summer '24</p>
                </div>
                <div class="highlight-card" style="height: 180px; display: flex; flex-direction: column; justify-content: center;">
                    <i class="fas fa-image" style="font-size: 40px;"></i>
                    <p style="color: #f0f0f0; margin-top: 10px;">Christmas</p>
                </div>
                <div class="highlight-card" style="height: 180px; display: flex; flex-direction: column; justify-content: center;">
                    <i class="fas fa-image" style="font-size: 40px;"></i>
                    <p style="color: #f0f0f0; margin-top: 10px;">Reunion</p>
                </div>
                <div class="highlight-card" style="height: 180px; display: flex; flex-direction: column; justify-content: center;">
                    <i class="fas fa-image" style="font-size: 40px;"></i>
                    <p style="color: #f0f0f0; margin-top: 10px;">Birthday</p>
                </div>
                <div class="highlight-card" style="height: 180px; display: flex; flex-direction: column; justify-content: center;">
                    <i class="fas fa-image" style="font-size: 40px;"></i>
                    <p style="color: #f0f0f0; margin-top: 10px;">Trip</p>
                </div>
                <div class="highlight-card" style="height: 180px; display: flex; flex-direction: column; justify-content: center;">
                    <i class="fas fa-image" style="font-size: 40px;"></i>
                    <p style="color: #f0f0f0; margin-top: 10px;">Cousins</p>
                </div>
            </div>
            
            <p style="margin-top: 40px; font-style: italic; color: #ddd; text-align: center;">(Placeholders – add your own cherished photos!)</p>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>&copy; 2026 Family Roots. All rights reserved. Made with <i class="fas fa-heart" style="color: #ff6b6b;"></i></p>
        <div class="social-icons">
            <a href="#" class="social-icon" onclick="showMessage('Facebook')"><i class="fab fa-facebook"></i></a>
            <a href="#" class="social-icon" onclick="showMessage('Twitter')"><i class="fab fa-twitter"></i></a>
            <a href="#" class="social-icon" onclick="showMessage('Instagram')"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon" onclick="showMessage('YouTube')"><i class="fab fa-youtube"></i></a>
            <a href="#" class="social-icon" onclick="showMessage('Pinterest')"><i class="fab fa-pinterest"></i></a>
        </div>
    </footer>

    <script>
        function showMessage(platform) {
            Swal.fire({
                title: platform,
                text: 'You clicked on ' + platform,
                icon: 'info',
                confirmButtonText: 'Close'
            });
        }

        function goToHomePage() {
            window.location.href = 'index.html';
        }

        function toggleSideTab() {
            var sideTab = document.getElementById('sideTab');
            sideTab.classList.toggle('active');
        }

        document.addEventListener('click', function(event) {
            var sideTab = document.getElementById('sideTab');
            var toggleBtn = document.querySelector('.side-tab-toggle');
            
            if (sideTab.classList.contains('active')) {
                if (!sideTab.contains(event.target) && !toggleBtn.contains(event.target)) {
                    sideTab.classList.remove('active');
                }
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            var footerYear = document.querySelector('footer p');
            if (footerYear) {
                var year = new Date().getFullYear();
                footerYear.textContent = footerYear.textContent.replace('2026', year);
            }
        });
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('images/family-wallpaper.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .home-link {
            position: fixed;
            top: 10px;
            left: 20px;
            z-index: 1000;
            cursor: pointer;
        }

        .home-link img {
            width: 80px;
            height: auto;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .home-link img:hover {
            transform: scale(1.1);
        }

        .side-tab {
            position: fixed;
            top: -100%;
            right: 20px;
            background-color: #1976d2;
            padding: 20px;
            z-index: 999;
            display: none;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            transition: top 0.5s ease;
            margin-top: 10px;
            min-width: 200px;
        }

        .side-tab.active {
            top: 80px;
            display: block;
        }

        .side-tab a {
            display: block;
            color: #fff;
            text-decoration: none;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .side-tab a i {
            margin-right: 12px;
            width: 20px;
        }

        .side-tab a:hover {
            background-color: #1565c0;
        }

        .side-tab a.active {
            background-color: #1565c0;
            border-left: 3px solid #ffd54f;
        }

        .side-tab-toggle {
            background-image: linear-gradient(135deg, #008aff, #86d472);
            border-radius: 6px;
            box-sizing: border-box;
            color: #ffffff;
            display: block;
            height: 50px;
            font-size: 1.4em;
            font-weight: 600;
            padding: 4px;
            position: fixed;
            top: 20px;
            right: 20px;
            text-decoration: none;
            width: 7em;
            z-index: 1000;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .side-tab-toggle:hover {
            transform: scale(1.05);
        }
