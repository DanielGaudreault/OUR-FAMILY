<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Roots · Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" type="image/png" href="images/MyLogo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/MyLogo.png">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="home-link" onclick="goToHomePage()">
        <img src="images/MyLogo.png" alt="Home">
    </div>

    <div class="side-tab" id="sideTab">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
        <a href="family.html" class="nav-link"><i class="fas fa-users"></i> Family</a>
        <a href="timeline.html" class="nav-link"><i class="fas fa-clock"></i> Timeline</a>
        <a href="gallery.html" class="nav-link"><i class="fas fa-image"></i> Gallery</a>
        <a href="achievements.html" class="nav-link"><i class="fas fa-trophy"></i> Achievements</a>
        <a href="contact.html" class="nav-link active"><i class="fas fa-envelope"></i> Contact</a>
    </div>

    <button class="side-tab-toggle" onclick="toggleSideTab()">
        <span class="side-tab-span">Menu</span>
    </button>

    <section class="page-hero">
        <div class="page-content" style="max-width: 800px; margin: 0 auto;">
            <h1>📬 Reach Out</h1>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; margin-top: 40px;">
                <div class="highlight-card">
                    <i class="fas fa-envelope"></i>
                    <p style="color: #f0f0f0;"><strong>Email</strong><br>family@roots.com</p>
                </div>
                <div class="highlight-card">
                    <i class="fas fa-phone-alt"></i>
                    <p style="color: #f0f0f0;"><strong>Phone</strong><br>+1 (555) 202-2026</p>
                </div>
                <div class="highlight-card">
                    <i class="fas fa-map-pin"></i>
                    <p style="color: #f0f0f0;"><strong>Gatherings</strong><br>Virtual & in-person</p>
                </div>
            </div>
            
            <div style="margin-top: 40px; background: rgba(0,0,0,0.3); padding: 30px; border-radius: 5px; text-align: center;">
                <p style="color: #f0f0f0; font-size: 18px;">
                    <i class="fas fa-comment-dots" style="color: #ffd54f; margin-right: 10px;"></i>
                    We'd love to hear from you – drop us a line anytime.
                </p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Family Roots. All rights reserved. Made with <i class="fas fa-heart" style="color: #ff6b6b;"></i></p>
        <div class="social-icons">
            <a href="#" class="social-icon" onclick="showMessage('Facebook')"><i class="fab fa-facebook"></i></a>
            <a href="#" class="social-icon" onclick="showMessage('Twitter')"><i class="fab fa-twitter"></i></a>
            <a href="#" class="social-icon" onclick="showMessage('Instagram')"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon" onclick="showMessage('YouTube')"><i class="fab fa-youtube"></i></a>
            <a href="#" class="social-icon" onclick="showMessage('Pinterest')"><i class="fab fa-pinterest"></i></a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
