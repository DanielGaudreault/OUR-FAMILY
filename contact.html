<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Roots · Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/png" href="images/MyLogo.png">
</head>
<body>
    <div class="home-link" onclick="goToHomePage()">
        <img src="images/MyLogo.png" alt="Home">
    </div>

    <div class="side-tab" id="sideTab">
        <a href="index.html" class="nav-link">Home</a>
        <a href="family.html" class="nav-link">Family</a>
        <a href="timeline.html" class="nav-link">Timeline</a>
        <a href="gallery.html" class="nav-link">Gallery</a>
        <a href="achievements.html" class="nav-link">Achievements</a>
        <a href="contact.html" class="nav-link active">Contact</a>
    </div>

    <button class="side-tab-toggle" onclick="toggleSideTab()">
        <span class="side-tab-span"><i class="fas fa-bars"></i> Menu</span>
    </button>

    <section class="page-hero" style="padding-top: 100px;">
        <div class="page-content" style="max-width: 800px; margin: 0 auto; padding: 40px 20px;">
            <h1 style="color: #fff; font-size: 48px; font-weight: 300; text-align: center; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">📬 Reach Out</h1>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; margin-top: 40px;">
                <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(4px); padding: 30px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease;">
                    <i class="fas fa-envelope" style="font-size: 40px; color: #e8b86d; margin-bottom: 15px;"></i>
                    <p style="color: #f0f0f0;"><strong>Email</strong><br>family@roots.com</p>
                </div>
                <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(4px); padding: 30px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease;">
                    <i class="fas fa-phone-alt" style="font-size: 40px; color: #e8b86d; margin-bottom: 15px;"></i>
                    <p style="color: #f0f0f0;"><strong>Phone</strong><br>+1 (555) 202-2026</p>
                </div>
                <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(4px); padding: 30px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease;">
                    <i class="fas fa-map-pin" style="font-size: 40px; color: #e8b86d; margin-bottom: 15px;"></i>
                    <p style="color: #f0f0f0;"><strong>Gatherings</strong><br>Virtual & in-person</p>
                </div>
            </div>
            
            <div style="margin-top: 40px; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); padding: 30px; border-radius: 20px; text-align: center; border: 1px solid rgba(232,184,109,0.3);">
                <p style="color: #f0f0f0; font-size: 18px;">
                    <i class="fas fa-comment-dots" style="color: #e8b86d; margin-right: 10px;"></i>
                    We'd love to hear from you – drop us a line anytime.
                </p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Family Roots. All rights reserved. Made with <i class="fas fa-heart" style="color: #ff6b6b;"></i></p>
        <div class="social-icons">
            <a href="#" class="social-icon" onclick="showMessage('Facebook')"><i class="fab fa-facebook"></i></a>
            <a href="#" class="social-icon" onclick="showMessage('Twitter')"><i class="fab fa-twitter"></i></a>
            <a href="#" class="social-icon" onclick="showMessage('Instagram')"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon" onclick="showMessage('YouTube')"><i class="fab fa-youtube"></i></a>
            <a href="#" class="social-icon" onclick="showMessage('Pinterest')"><i class="fab fa-pinterest"></i></a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
