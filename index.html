<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OUR-FAMILY</title>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#08111f;
color:white;
overflow-x:hidden;
}

nav{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(10px);
z-index:1000;
}

.logo{
font-size:30px;
font-weight:900;
color:#ffd166;
}

nav ul{
display:flex;
list-style:none;
gap:30px;
}

nav ul li a{
text-decoration:none;
color:white;
font-weight:500;
transition:.3s;
}

nav ul li a:hover{
color:#ffd166;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;

background:
linear-gradient(
rgba(0,0,0,.45),
rgba(0,0,0,.75)
),
url("https://images.unsplash.com/photo-1511895426328-dc8714191300?q=80&w=1920");

background-size:cover;
background-position:center;
}

.hero-content{
max-width:850px;
padding:20px;
}

.hero h1{
font-size:80px;
font-weight:900;
margin-bottom:20px;
}

.hero p{
font-size:24px;
margin-bottom:40px;
}

.btn{
display:inline-block;
padding:16px 40px;
border-radius:50px;
background:#ffd166;
color:black;
text-decoration:none;
font-weight:700;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

section{
padding:100px 10%;
text-align:center;
}

h2{
font-size:48px;
margin-bottom:50px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
}

.stat{
padding:35px;
background:#11233c;
border-radius:20px;
}

.stat h3{
font-size:50px;
color:#ffd166;
}

.family-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.card{
background:#11233c;
padding:25px;
border-radius:20px;
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
}

.
